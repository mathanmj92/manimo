name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fast-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Fast tests (standard library only, no render stack)
        run: python -m unittest discover -s tests -t . -v
      - name: JavaScript parses
        run: |
          foreach ($f in Get-ChildItem app\assets\*.js) { node --check $f.FullName; if ($LASTEXITCODE) { exit 1 } }
        shell: pwsh
